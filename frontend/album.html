<!DOCTYPE html>
<html>
    <head>
        <title>Music - Album</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <nav>
            <ol>
                <li><a href="index.html">Home</a></li>
                <li><a href="artists.html">Artists</a></li>
                <li><a href="albums.html">Albums</a></li>
                <li><a href="tracks.html">Tracks</a></li>
                <li><a href="genres.html">Genres</a></li>
            </ol>
        </nav>
         <div class="floating-actions">
            <button id="delete" disabled>Delete</button>
            <button command="show-modal" commandfor="edit-dialog">Edit</button>
        </div>
        <dialog id="edit-dialog">
            <h1>Edit album</h1>
            <form id="album-form" method="dialog">
                <label for="title">Album title:</label>
                <input id="title" name="title" type="text" required>
                <label for="artist-id">Artist ID:</label>
                <input id="artist-id" name="artistId" type="number" required>
                <label for="release-date">Release date:</label>
                <input id="release-date" name="releaseDate" type="date">
                <label for="riaa">RIAA certificate:</label>
                <input id="riaa" name="riaaCertificate" type="text">
                <div class="actions">
                    <button name="cancel" value="cancel" formnovalidate>Cancel</button>
                    <button name="save" value="save">Save</button>
                </div>
            </form>
        </dialog>
        <div id="content"></div>
        <script src="album.js" type="module"></script>
    </body>
</html>
